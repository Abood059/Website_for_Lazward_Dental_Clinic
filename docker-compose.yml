version: '3.8'

services:
  # MongoDB Service - Optimized for low resources
  mongodb:
    image: mongo:7.0
    container_name: lazward-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: lazord_lab
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-lazward}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - lazward-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: mongod --wiredTigerCacheSizeGB 0.1 --journalCommitIntervalMs 100

  # Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazward-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USERNAME:-lazward}:${MONGO_PASSWORD}@mongodb:27017/lazord_lab?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      NODE_OPTIONS: --max-old-space-size=256
      UV_THREADPOOL_SIZE: 2
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    networks:
      - lazward-network
    depends_on:
      mongodb:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/stats', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lazward-network:
    driver: bridge
    name: lazward-network

volumes:
  mongodb_data:
    driver: local
    name: lazward-mongodb-data
  mongodb_config:
    driver: local
    name: lazward-mongodb-config
  uploads_data:
    driver: local
    name: lazward-uploads-data
