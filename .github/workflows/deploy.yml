name: CI/CD Pipeline for Lazward Dental Clinic

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 2: Build and Test Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t lazward-app:test .
          docker images

      - name: Test Docker container
        run: |
          # Create a test environment file
          echo "NODE_ENV=test" > .env.test
          echo "PORT=5000" >> .env.test
          echo "MONGO_URI=mongodb://localhost:27017/lazord_test" >> .env.test
          echo "JWT_SECRET=test_secret_key" >> .env.test
          echo "JWT_EXPIRES_IN=1d" >> .env.test
          
          # Start MongoDB for testing
          docker run -d --name test-mongo -p 27017:27017 mongo:7.0
          
          # Wait for MongoDB to be ready
          sleep 10
          
          # Run the app container
          docker run -d --name test-app --network host --env-file .env.test lazward-app:test
          
          # Wait for app to start
          sleep 30
          
          # Health check
          curl -f http://localhost:5000/api/stats || exit 1
          
          # Cleanup
          docker stop test-app test-mongo
          docker rm test-app test-mongo

  # Job 3: Deploy to VPS
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create project directory on VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /home/${{ secrets.VPS_USER }}/lazward-dental-clinic"

      - name: Copy files to VPS
        run: |
          # Copy necessary files
          scp -i ~/.ssh/id_rsa \
            docker-compose.yml \
            Dockerfile \
            .dockerignore \
            package.json \
            package-lock.json \
            server.js \
            app.js \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/lazward-dental-clinic/
          
          # Copy directories
          scp -i ~/.ssh/id_rsa -r \
            config \
            routes \
            controllers \
            models \
            services \
            middleware \
            validations \
            utils \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/lazward-dental-clinic/
          
          # Copy static files
          scp -i ~/.ssh/id_rsa \
            *.html \
            *.css \
            *.js \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/lazward-dental-clinic/ 2>/dev/null || true
          
          # Copy images directory if exists
          scp -i ~/.ssh/id_rsa -r images ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/lazward-dental-clinic/ 2>/dev/null || true

      - name: Create .env file on VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /home/${{ secrets.VPS_USER }}/lazward-dental-clinic/.env << 'EOF'
          NODE_ENV=production
          PORT=5000
          MONGO_URI=mongodb://lazward:${{ secrets.MONGO_PASSWORD }}@mongodb:27017/lazord_lab?authSource=admin
          MONGO_USERNAME=lazward
          MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          EOF"

      - name: Deploy using Docker Compose
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/${{ secrets.VPS_USER }}/lazward-dental-clinic && \
             docker-compose pull && \
             docker-compose up -d --build && \
             docker-compose ps"

      - name: Health Check
        run: |
          sleep 30
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "curl -f http://localhost:5000/api/stats || exit 1"

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      - name: Notify on success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed!"
